<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIAIR - Bulk Import</title>
<style>
  :root { --bg:#15151f; --panel:#1d1d2a; --line:#2c2c3c; --text:#e8e8f0; --muted:#8a8aa0; }
  * { box-sizing: border-box; }
  
  html, body { height:100%; overflow:hidden; }
  body { margin:0; font-family: -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  .top-sticky { position: sticky; top:0; z-index: 50; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:700; white-space:nowrap; }
  header .sub { font-size:11px; color:var(--muted); }
  
  #close-btn {
    background:#0e0e16; color:#e05a5a; border:1px solid #e05a5a; margin-left:auto;
    padding:6px 14px; font-size:12px; font-weight:700; border-radius:4px; cursor:pointer;
  }
  #close-btn:hover { background:#2a1616; }
  
  #hover-info {
    height:40px; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:0 16px; font-size:15px; font-weight:700; border-bottom:1px solid var(--line);
    background:var(--panel); color:var(--muted);
    transition: background .08s ease, color .08s ease, height .12s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #hover-info.bond-mode { height:145px; }
  .hover-photo { height:125px; width:auto; object-fit:contain; pointer-events:none; }
  .tabs { display:flex; gap:6px; }
  
  .tab-btn {
    background:#0e0e16; border:1px solid var(--accent, var(--line)); color:var(--accent, var(--muted));
    padding:6px 12px; font-size:12px; border-radius:4px; cursor:pointer; font-weight:600;
  }
  .tab-btn.active { color:#12121a; background:var(--accent, #4a90d9); border-color:var(--accent, #4a90d9); }
  
  .tab-btn.bond-tab {
    background: linear-gradient(90deg, #7CC7E8, #F19DB5);
    border: none; color:#12121a; opacity: .6;
  }
  .tab-btn.bond-tab.active { opacity: 1; box-shadow: 0 0 0 2px #fff; }
  #finished-btn {
    background:#ffd23f; color:#12121a; border:none; padding:6px 14px; font-size:12px; font-weight:800;
    border-radius:4px; cursor:pointer;
  }
  #finished-btn:hover { background:#ffdc66; }
  #finished-note {
    font-size:11px; color:#6ee89a; font-weight:700; opacity:0; transition:opacity .25s ease;
    white-space:nowrap;
  }
  #finished-note.show { opacity:1; }
  
  main { padding: 0; flex: 1 1 auto; display:flex; min-height:0; min-width:0; }
  section.grid-section { display:none; }
  section.grid-section.active { display:flex; flex-direction:column; flex:1; min-height:0; min-width:0; }
  .grid-scroll { flex:1; min-height:0; min-width:0; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  table.grid { border-collapse: collapse; font-size: 11px; }
  table.grid th, table.grid td {
    border-top: 1px solid #26263a; border-bottom: 1px solid #26263a;
    border-left: 1px solid #40405a; border-right: 1px solid #40405a;
    padding: 0;
  }

  
  td.song-head, th.corner {
    position: sticky; left:0; background:var(--panel); border-right:1px solid var(--line);
    padding:3px 10px; font-size:12.5px; white-space:nowrap; z-index:5; min-width:230px; max-width:230px;
    overflow:hidden; text-overflow:ellipsis; text-align:left;
  }
  th.corner { z-index: 8; top: 0; background:#22222f; }
  
  td.song-head.hl, th.member-header.hl { box-shadow: inset 0 0 0 2px var(--accent, #4a90d9); }

  table.grid th.col-boundary, table.grid td.col-boundary { border-left: 3px solid #6a6a8a; }

  
  th.member-header {
    background:#22222f; padding:4px 2px; vertical-align:top; text-align:center;
    position: sticky; top:0; z-index:6; height:104px; box-sizing:border-box; width:28px;
  }
  th.member-header .mh-name {
    writing-mode: vertical-rl; text-orientation: upright; font-size:12.5px; font-weight:700;
    letter-spacing: 2px;
    color:#aaa; white-space:nowrap; display:inline-block; height:96px; overflow:hidden; text-overflow:ellipsis;
  }

  
  tr.tier-divider td {
    background:#26263a; color:#b8b8cc; font-size:10px; font-weight:700; letter-spacing:.02em;
    padding:4px 10px; text-align:left; position:sticky; left:0; border-top:3px solid #6a6a8a;
  }
  tr.tier-divider.collapsible { cursor:pointer; }
  tr.tier-divider.collapsible td:hover { background:#2f2f45; }
  .tier-label { display:inline-flex; align-items:center; gap:5px; }
  .tier-arrow { font-size:8px; color:#8a8aa0; display:inline-block; width:8px; }
  .tier-note {
    margin-left:8px; font-size:10px; font-weight:400; letter-spacing:normal;
    color:var(--muted); white-space:normal;
  }
  tr.song-row.tier-row-hidden { display:none; }

  td.cell-none { background:#1a1a24; }
  td.cell-slot { width:28px; height:26px; cursor:pointer; text-align:center; font-weight:900; font-size:12px; color:#12121a; }
  td.cell-slot.state-check::after { content:"\2713"; }
  td.cell-slot.state-plus::after { content:"+"; }
  
  td.cell-slot.hl, td.cell-none.hl { box-shadow: inset 0 0 0 2px var(--accent, #4a90d9); }

  tr.flash td.song-head { animation: flashRow 1.4s ease; }
  @keyframes flashRow { 0%,100% { background:var(--panel);} 30% { background:#3a5a8a; } }

  
  .bond-scroll {
    flex:1; min-height:0; overflow:auto; border:1px solid var(--line);
    border-radius:8px; padding:14px 18px 18px;
  }
  .bond-group { margin-bottom:24px; }
  .bond-group:last-child { margin-bottom:0; }
  .bond-group-title {
    font-size:14px; font-weight:700; margin:0 0 10px; color:var(--accent, var(--text));
    border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .bond-grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:8px 12px;
  }
  .bond-tile {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px;
  }
  .bond-tile.graduated { opacity:.65; }
  
  .bond-name {
    font-size:12.5px; font-weight:700; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  
  .bond-input {
    width:56px; flex:0 0 auto; background:#0e0e16; border:1px solid var(--line);
    border-radius:4px; color:var(--text); font-size:13px; font-weight:700;
    text-align:right; padding:4px 6px;
  }
  .bond-input:focus { outline:none; border-color: var(--accent, #4a90d9); }

  .page-version-badge {
    position: fixed; bottom: 8px; right: 10px; z-index: 9999;
    background: rgba(0,0,0,0.55); color: #fff; font: 11px/1 -apple-system, sans-serif;
    padding: 3px 7px; border-radius: 6px; pointer-events: none; opacity: 0.5;
  }
  .page-version-badge.testing {
    background: #ffeb3b; color: #c62828; font-weight: 800; opacity: 0.95;
  }
</style>
</head>

<div class="page-version-badge">v3</div>

</div>
<main id="main"></main>

const BOND_STORAGE_KEY = 'uniair_public_kizuna_v1';
const BOND_GROUP_ORDER = ['HINATA', 'SAKURA'];
const BOND_GROUP_ACCENT = { HINATA: GROUP_HEX.hinata, SAKURA: GROUP_HEX.sakura };

function loadBondOverrides() {
  try { return JSON.parse(localStorage.getItem(BOND_STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveBondOverrides(ov) {
  localStorage.setItem(BOND_STORAGE_KEY, JSON.stringify(ov));
}
let bondOverrides = loadBondOverrides();

function buildBondSection() {
  const wrap = document.createElement('section');
  wrap.className = 'grid-section bond-section';
  wrap.dataset.id = 'bond';

  const scroll = document.createElement('div');
  scroll.className = 'bond-scroll';

  
  
  
  const allInputs = [];

  
  
  
  
  
  
  
  let focusedMember = null, hoveredMember = null;
  function refreshBondHover() {
    const m = focusedMember || hoveredMember;
    if (m) setBondHoverInfo(m); else clearHoverInfo();
  }

  BOND_GROUP_ORDER.forEach(groupName => {
    const members = BOND_MEMBERS[groupName] || [];
    if (!members.length) return;

    const groupWrap = document.createElement('div');
    groupWrap.className = 'bond-group';
    groupWrap.style.setProperty('--accent', BOND_GROUP_ACCENT[groupName] || '#4a90d9');

    const title = document.createElement('h2');
    title.className = 'bond-group-title';
    title.textContent = BOND_LABELS[groupName] || groupName;
    groupWrap.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'bond-grid';

    members.forEach(m => {
      const tile = document.createElement('label');
      tile.className = 'bond-tile' + (m.graduated ? ' graduated' : '');
      if (m.graduated) tile.title = m.name + ' (graduated)';
      tile.addEventListener('mouseenter', () => { hoveredMember = m; refreshBondHover(); });
      tile.addEventListener('mouseleave', () => {
        if (hoveredMember === m) hoveredMember = null;
        refreshBondHover();
      });

      const nameEl = document.createElement('span');
      nameEl.className = 'bond-name';
      nameEl.textContent = m.name;
      tile.appendChild(nameEl);

      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'numeric';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.className = 'bond-input';
      input.maxLength = 4;
      input.setAttribute('aria-label', 'Bond value for ' + m.name);

      const ovKey = groupName + '::' + m.name;
      const cur = bondOverrides[ovKey];
      input.value = (typeof cur === 'number' && cur > 0) ? String(cur) : '';
      input.placeholder = '0';
      tile.appendChild(input);
      allInputs.push(input);

      input.addEventListener('input', () => {
        const digits = input.value.replace(/\D/g, '').slice(0, 4);
        if (digits !== input.value) input.value = digits;
        const n = digits === '' ? 0 : parseInt(digits, 10);
        if (n > 0) bondOverrides[ovKey] = n; else delete bondOverrides[ovKey];
        saveBondOverrides(bondOverrides);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const next = allInputs[allInputs.indexOf(input) + 1];
          if (next) next.focus(); else input.blur();
        }
      });
      input.addEventListener('focus', () => { focusedMember = m; refreshBondHover(); });
      input.addEventListener('blur', () => {
        if (focusedMember === m) focusedMember = null;
        refreshBondHover();
      });

      grid.appendChild(tile);
    });

    groupWrap.appendChild(grid);
    scroll.appendChild(groupWrap);
  });

  wrap.appendChild(scroll);
  return wrap;
}

  thead.appendChild(headRow);

  const tierByStart = {};

      divTd.colSpan = sec.rows.length + 1;

      const labelSpan = document.createElement('span');
      labelSpan.className = 'tier-label';
      if (tg.collapsible) {
        const arrow = document.createElement('span');
        arrow.className = 'tier-arrow';
        arrow.textContent = tg.defaultCollapsed ? '▶' : '▼';
        labelSpan.appendChild(arrow);
      }
      labelSpan.appendChild(document.createTextNode(tg.label + ' (' + tg.count + ')'));
      divTd.appendChild(labelSpan);

      if (tg.note) {
        const noteSpan = document.createElement('span');
        noteSpan.className = 'tier-note';
        noteSpan.textContent = tg.note;
        divTd.appendChild(noteSpan);
      }

      if (tg.collapsible) {
        divTr.addEventListener('click', () => {
          const collapsedNow = divTr.classList.toggle('is-collapsed');
          divTd.querySelector('.tier-arrow').textContent = collapsedNow ? '▶' : '▼';
          scrollWrap.querySelectorAll('tr.song-row[data-tier="' + tg.label + '"]').forEach(r => {
            r.classList.toggle('tier-row-hidden', collapsedNow);
          });
        });
        if (tg.defaultCollapsed) divTr.classList.add('is-collapsed');
      }

      divTr.appendChild(divTd);
      tbody.appendChild(divTr);
    }

    const tr = document.createElement('tr');
    tr.className = 'song-row' + (currentTier && currentTier.collapsible && currentTier.defaultCollapsed ? ' tier-row-hidden' : '');
    tr.dataset.tier = currentTier ? currentTier.label : '';
    tr.id = 's-' + sec.id + '-' + j;
    const head = document.createElement('td');
    head.className = 'song-head';
    head.dataset.col = j;
    head.textContent = song;
    head.title = song;
    tr.appendChild(head);
    songHeadCells.push(head);

    sec.rows.forEach((row, i) => {
      const slot = row.slots[j];
      const td = document.createElement('td');
      td.dataset.row = i;
      
      
      
      
      const boundaryCls = row.rowBoundary ? ' col-boundary' : '';
      if (!slot) {
        td.className = 'cell-none' + boundaryCls;
      } else {
        td.className = 'cell-slot' + boundaryCls;
        td.dataset.color = slot.color;
        
        
        const realTitle = slot.title;
        td.title = row.member + ' - ' + realTitle;
        td.dataset.member = row.member;
        td.dataset.memberEn = row.memberEn;
        td.dataset.song = realTitle;
        td.dataset.hasPlus = slot.hasPlus ? '1' : '0';
        td.dataset.hasBase = slot.hasBase ? '1' : '0';
        if (slot.baseId) td.dataset.baseId = slot.baseId;
        if (slot.plusId) td.dataset.plusId = slot.plusId;
        const key = sec.id + '|' + i + '|' + j;
        
        
        let initState = 0;
        if (SEED_MODE) {
          if (slot.plusId && ownedSet[slot.plusId]) initState = 2;
          else if (slot.baseId && ownedSet[slot.baseId]) initState = 1;
        }
        cellState[key] = initState;
        td.dataset.stateKey = key;
        applyCellVisual(td, initState);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  wrap.appendChild(scrollWrap);

  
  
  
  let lastRowCell = null, lastColCell = null, lastDataCell = null;
  tbody.addEventListener('mouseover', (e) => {
    const td = e.target.closest('td');
    if (!td || !td.closest('tr.song-row')) return;
    const tr = td.closest('tr');
    const rowCell = tr.querySelector('td.song-head');
    if (rowCell !== lastRowCell) {
      if (lastRowCell) lastRowCell.classList.remove('hl');
      rowCell.classList.add('hl');
      lastRowCell = rowCell;
    }
    const col = td.dataset.row;
    const colCell = col !== undefined ? memberHeaderCells[+col] : null;
    if (colCell !== lastColCell) {
      if (lastColCell) lastColCell.classList.remove('hl');
      if (colCell) colCell.classList.add('hl');
      lastColCell = colCell;
    }
    
    
    
    
    
    const isDataCell = td.classList.contains('cell-slot') || td.classList.contains('cell-none');
    if (isDataCell && td !== lastDataCell) {
      if (lastDataCell) lastDataCell.classList.remove('hl');
      td.classList.add('hl');
      lastDataCell = td;
    } else if (!isDataCell && lastDataCell) {
      lastDataCell.classList.remove('hl');
      lastDataCell = null;
    }
    if (td.classList.contains('cell-slot')) {
      setHoverInfo(td.dataset.memberEn, td.dataset.song, td.dataset.color);
    } else {
      clearHoverInfo();
    }
  });
  tbody.addEventListener('mouseleave', () => {
    if (lastRowCell) lastRowCell.classList.remove('hl');
    if (lastColCell) lastColCell.classList.remove('hl');
    if (lastDataCell) lastDataCell.classList.remove('hl');
    lastRowCell = null; lastColCell = null; lastDataCell = null;
    clearHoverInfo();
  });

  tbody.addEventListener('click', (e) => {
    const td = e.target.closest('td.cell-slot');
    if (!td) return;
    const key = td.dataset.stateKey;
    const hasPlus = td.dataset.hasPlus === '1';
    const cur = cellState[key] || 0;
    const next = hasPlus ? (cur + 1) % 3 : (cur === 0 ? 1 : 0);
    cellState[key] = next;
    applyCellVisual(td, next);

    
    
    
    const baseId = td.dataset.baseId;
    const plusId = td.dataset.plusId;
    if (baseId) delete ownedSet[baseId];
    if (plusId) delete ownedSet[plusId];
    if (next === 1 && baseId) ownedSet[baseId] = true;
    else if (next === 2 && plusId) ownedSet[plusId] = true;
    saveOwned(ownedSet);
  });

  return wrap;
}

const main = document.getElementById('main');
const tabsEl = document.getElementById('tabs');





const bondBtn = document.createElement('button');
bondBtn.className = 'tab-btn bond-tab active';
bondBtn.textContent = 'Kizuna Bond';
bondBtn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('section.grid-section').forEach(s => s.classList.remove('active'));
  bondBtn.classList.add('active');
  document.querySelector('section.grid-section[data-id="bond"]').classList.add('active');
  setHoverBarMode(true);
});
tabsEl.appendChild(bondBtn);
const bondSection = buildBondSection();
bondSection.classList.add('active');
main.appendChild(bondSection);

SECTIONS.forEach((sec) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn';
  btn.style.setProperty('--accent', GROUP_HEX[sec.id] || '#4a90d9');
  btn.textContent = sec.label;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section.grid-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector('section.grid-section[data-id="' + sec.id + '"]').classList.add('active');
    setHoverBarMode(false);
  });
  tabsEl.appendChild(btn);

  const secEl = buildSection(sec);
  main.appendChild(secEl);
});



setHoverBarMode(true);










function currentOwnedList() {
  return Object.keys(ownedSet).map(id => {
    const info = ID_INFO[id];
    return { id: Number(id), member: info ? info.member : null, title: info ? info.title : null };
  });
}
const finishedBtn = document.getElementById('finished-btn');
const finishedNote = document.getElementById('finished-note');
let finishedTimer = null;
finishedBtn.addEventListener('click', () => {
  finishedNote.classList.add('show');
  clearTimeout(finishedTimer);
  finishedTimer = setTimeout(() => finishedNote.classList.remove('show'), 4000);

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'uniair-import-finished', owned: currentOwnedList() }, '*');
  }
});









function restoreStorageKey(key, rawValue) {
  if (rawValue === null) localStorage.removeItem(key);
  else localStorage.setItem(key, rawValue);
}
const closeBtn = document.getElementById('close-btn');
closeBtn.addEventListener('click', () => {
  const ok = window.confirm(
    "Close without saving? Any cards or Kizuna Bond values you've marked " +
    'in this session will be lost.'
  );
  if (!ok) return;

  restoreStorageKey(OWNED_KEY, CLOSE_BASELINE_OWNED_RAW);
  restoreStorageKey(BOND_STORAGE_KEY, CLOSE_BASELINE_BOND_RAW);

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'uniair-import-cancel' }, '*');
  } else {
    location.reload();
  }
});






window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'uniair-request-snapshot') {
    e.source.postMessage({ type: 'uniair-snapshot', id: msg.id, owned: currentOwnedList() }, '*');
  } else if (msg.type === 'uniair-import-data') {
    const list = msg.data && msg.data.owned;
    let added = 0;
    if (Array.isArray(list)) {
      list.forEach(entry => {
        if (!entry || entry.id === undefined || entry.id === null) return;
        if (!ownedSet[entry.id]) { ownedSet[entry.id] = true; added++; }
      });
      if (added) saveOwned(ownedSet);
    }
    e.source.postMessage({ type: 'uniair-import-ack', id: msg.id, page: 'import', changed: added }, '*');
  }
});
