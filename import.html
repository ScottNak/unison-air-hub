<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIAIR - Bulk Import</title>
<style>
  :root { --bg:#15151f; --panel:#1d1d2a; --line:#2c2c3c; --text:#e8e8f0; --muted:#8a8aa0; }
  * { box-sizing: border-box; }
  /* overflow:hidden on the outer page so the ONLY scrollbar is
     .grid-scroll's own - without this, body could grow a hair taller than
     one viewport (header wrap, borders, etc.) and the page itself would
     also become scrollable alongside the grid's internal scroll area
     (Scott 2026-08-05: "make sure there is only one"). */
  html, body { height:100%; overflow:hidden; }
  body { margin:0; font-family: -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  .top-sticky { position: sticky; top:0; z-index: 50; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:700; white-space:nowrap; }
  header .sub { font-size:11px; color:var(--muted); }
  header .alt-link { font-size:11px; color:#7ab4ff; text-decoration:none; }
  header .alt-link:hover { text-decoration:underline; }
  #progress { font-size:12px; color:var(--muted); margin-left:auto; white-space:nowrap; }
  #progress b { color:var(--text); }
  #hover-info {
    height:40px; display:flex; align-items:center; justify-content:center;
    padding:0 16px; font-size:15px; font-weight:700; border-bottom:1px solid var(--line);
    background:var(--panel); color:var(--muted); transition: background .08s ease, color .08s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .jump-wrap { position: relative; }
  #jump-box { background:#0e0e16; border:1px solid var(--line); color:var(--text); padding:6px 10px; font-size:12px; border-radius:4px; width:220px; }
  #jump-list { position:absolute; top:100%; left:0; right:0; background:#0e0e16; border:1px solid var(--line); border-top:none; max-height:260px; overflow-y:auto; z-index:60; display:none; }
  #jump-list div { padding:5px 10px; font-size:12px; cursor:pointer; }
  #jump-list div:hover, #jump-list div.active { background:#2a2a3e; }
  .tabs { display:flex; gap:6px; }
  .tab-btn { background:#0e0e16; border:1px solid var(--line); color:var(--muted); padding:6px 12px; font-size:12px; border-radius:4px; cursor:pointer; }
  .tab-btn.active { color:var(--text); border-color:#4a90d9; }
  /* 2026-08-05: grid fills all remaining viewport height below the sticky
     header (Scott: "expand to the entire space available") instead of a
     fixed max-height:76vh that left dead space under the table - main and
     the active section are flex containers so .grid-scroll's flex:1 grows
     to fill whatever room is actually left, on any window size. */
  /* min-width:0 alongside min-height:0 at every level - a flex item's
     automatic minimum size defaults to its content's min-content size on
     BOTH axes, so without this the ~170-column table's intrinsic width
     forces section/main wider instead of staying put and letting
     .grid-scroll's own overflow:auto handle it, which combined with
     overflow:hidden on the page meant horizontal scroll silently couldn't
     happen at all (Scott 2026-08-05: "can't seem to scroll horizontally"). */
  main { padding: 0; flex: 1 1 auto; display:flex; min-height:0; min-width:0; }
  section.grid-section { display:none; }
  section.grid-section.active { display:flex; flex-direction:column; flex:1; min-height:0; min-width:0; }
  .grid-scroll { flex:1; min-height:0; min-width:0; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  table.grid { border-collapse: collapse; font-size: 11px; }
  table.grid th, table.grid td {
    border-top: 1px solid #26263a; border-bottom: 1px solid #26263a;
    border-left: 1px solid #40405a; border-right: 1px solid #40405a;
    padding: 0;
  }

  td.rowhead, th.corner {
    position: sticky; left:0; background:var(--panel); border-right:1px solid var(--line);
    padding:3px 10px 3px 6px; font-size:11px; white-space:nowrap; z-index:5; min-width:130px; max-width:130px;
    overflow:hidden; text-overflow:ellipsis; text-align:left;
  }
  th.corner { z-index: 8; top: 0; background:#22222f; }
  td.rowhead .en { display:block; color:var(--muted); font-size:9px; }
  td.rowhead.grad .jp::after { content:" \1F393"; font-size:9px; }
  td.rowhead.hl, th.song-header.hl { background:#3a5a8a; color:#fff; }

  /* table.grid-prefixed so these reliably beat the base border rule above
     on specificity - a plain "tr.row-boundary td" / "td.col-boundary" was
     the same or lower specificity than "table.grid td", so it silently
     lost the cascade and never rendered (caught 2026-08-03: "i dont see
     the borders for the song sections"). */
  table.grid tr.row-boundary td, table.grid tr.row-boundary th { border-top: 3px solid #6a6a8a; }
  table.grid th.col-boundary, table.grid td.col-boundary { border-left: 3px solid #6a6a8a; }

  /* 2026-08-05: group header row above the song names (Scott: "add a group
     header for the column sections") - one labeled th per non-empty tier
     ("SSR+ Discography Songs" / "General Songs" / "Happy Nth Birthday" /
     "FL Songs"), spanning that tier's columns. th.corner gets rowspan=2 in
     the JS below to cover both header rows; th.song-header's sticky top
     offset shifts down by this row's own height so the two rows stack
     correctly while scrolling instead of overlapping. */
  th.tier-header {
    background:#26263a; padding:3px 4px; text-align:center; font-size:10px; font-weight:700;
    color:#b8b8cc; letter-spacing:.02em; position: sticky; top:0; z-index:7; height:20px;
    box-sizing:border-box; border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  th.song-header {
    background:#22222f; padding:4px 2px; vertical-align:top; text-align:center;
    position: sticky; top:20px; z-index:6; height:118px; box-sizing:border-box; width:26px;
  }
  th.song-header .sh-name {
    writing-mode: vertical-rl; text-orientation: upright; font-size:9.5px; font-weight:700;
    color:#aaa; white-space:nowrap; display:inline-block; height:108px; overflow:hidden; text-overflow:ellipsis;
  }

  td.cell-none { background:#1a1a24; }
  td.cell-slot { width:26px; height:26px; cursor:pointer; text-align:center; font-weight:900; font-size:12px; color:#12121a; }
  td.cell-slot.state-check::after { content:"\2713"; }
  td.cell-slot.state-plus { box-shadow: inset 0 0 0 2px #ffd23f; }
  td.cell-slot.state-plus::after { content:"+"; }

  tr.flash td.rowhead { animation: flashRow 1.4s ease; }
  @keyframes flashRow { 0%,100% { background:var(--panel);} 30% { background:#3a5a8a; } }
</style>
</head>

</div>

    delete ownedSet[plusKey];
    if (next === 1) ownedSet[baseKey] = true;
    else if (next === 2) ownedSet[plusKey] = true;
    saveOwned(ownedSet);

    updateProgress();
  });

  return wrap;
}

const main = document.getElementById('main');
const tabsEl = document.getElementById('tabs');
SECTIONS.forEach((sec, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.textContent = sec.label;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section.grid-section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector('section.grid-section[data-id="' + sec.id + '"]').classList.add('active');
  });
  tabsEl.appendChild(btn);

  const secEl = buildSection(sec);
  if (i === 0) secEl.classList.add('active');
  main.appendChild(secEl);
});
updateProgress();

// Jump-to-member search.
const jumpBox = document.getElementById('jump-box');
const jumpList = document.getElementById('jump-list');
const ALL_MEMBERS = [];
SECTIONS.forEach(sec => sec.rows.forEach(r => ALL_MEMBERS.push({ member: r.member, memberEn: r.memberEn, sectionId: sec.id })));

// Strips macrons/diacritics (Endō -> Endo) so a plain-ASCII search still
// matches romanized names, which almost nobody types with the macron.
function foldDiacritics(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function renderJumpList(q) {
  const ql = foldDiacritics(q.trim().toLowerCase());
  if (!ql) { jumpList.style.display = 'none'; jumpList.innerHTML = ''; return; }
  const matches = ALL_MEMBERS.filter(m => m.member.includes(q) || foldDiacritics(m.memberEn.toLowerCase()).includes(ql)).slice(0, 20);
  jumpList.innerHTML = '';
  matches.forEach(m => {
    const div = document.createElement('div');
    div.textContent = m.member + ' (' + m.memberEn + ')';
    div.addEventListener('mousedown', () => jumpTo(m));
    jumpList.appendChild(div);
  });
  jumpList.style.display = matches.length ? 'block' : 'none';
}
function jumpTo(m) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('section.grid-section').forEach(s => s.classList.remove('active'));
  const idx = SECTIONS.findIndex(s => s.id === m.sectionId);
  tabsEl.children[idx].classList.add('active');
  document.querySelector('section.grid-section[data-id="' + m.sectionId + '"]').classList.add('active');
  const row = document.getElementById('m-' + m.sectionId + '-' + encodeURIComponent(m.member));
  if (row) {
    row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1450);
  }
  jumpBox.value = '';
  jumpList.style.display = 'none';
}
jumpBox.addEventListener('input', () => renderJumpList(jumpBox.value));
jumpBox.addEventListener('blur', () => setTimeout(() => jumpList.style.display = 'none', 150));

// Same cross-tab snapshot/import protocol catalog.html answers, so this
// page can be wired into hub.html's Export/Import broadcast later without
// changes here. Note this answers from the real (persisted) ownedSet, not
// from this page's blank-start cellState - a snapshot request should
// reflect the true cross-page store, same as catalog.html's does.
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'uniair-request-snapshot') {
    const owned = Object.keys(ownedSet).map(key => {
      const i = key.indexOf('|');
      return { member: key.slice(0, i), title: key.slice(i + 1) };
    });
    e.source.postMessage({ type: 'uniair-snapshot', id: msg.id, owned: owned }, '*');
  } else if (msg.type === 'uniair-import-data') {
    const list = msg.data && msg.data.owned;
    let added = 0;
    if (Array.isArray(list)) {
      list.forEach(entry => {
        if (!entry || !entry.member || !entry.title) return;
        const key = cardKey(entry.member, entry.title);
        if (!ownedSet[key]) { ownedSet[key] = true; added++; }
      });
      if (added) saveOwned(ownedSet);
    }
    e.source.postMessage({ type: 'uniair-import-ack', id: msg.id, page: 'import', changed: added }, '*');
  }
});
</script>
