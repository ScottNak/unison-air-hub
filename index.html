<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UNI'S ON AIR — Public Hub</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, #1a1a2e, #16213e 60%, #0f3460);
  }
  header { padding: 20px 16px 0; flex: none; }
  h1 { color: #fff; text-align: center; font-size: 24px; margin: 0 0 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .subtitle { color: #cfd8ff; text-align: center; margin: 0 0 16px; font-size: 12.5px; }

  .tabs {
    display: flex; justify-content: center; gap: 8px; padding: 0 16px 16px;
    flex: none; flex-wrap: wrap;
  }
  .tab {
    appearance: none; border: none; cursor: pointer; font-weight: 700; font-size: 13px;
    padding: 10px 18px; border-radius: 10px 10px 0 0;
    background: rgba(255,255,255,0.55); color: #2d2d42;
    transition: background .12s ease, color .12s ease;
  }
  .tab.active { background: #fff; color: #2d2d42; }
  .tab:not(.active):hover { background: rgba(255,255,255,0.75); }

  .frame-wrap { flex: 1 1 auto; background: #fff; margin: 0 16px 16px; border-radius: 0 12px 12px 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35); overflow: hidden; position: relative; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none;
  }
  iframe.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>UNI'S ON AIR — Hub</h1>
  <p class="subtitle">Card Database & Discography</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="frame-wrap" id="frame-wrap"></div>

<script>
  // Public hub pages. Update the "file" field here if a page is renamed/replaced.
  var pages = [
    { id: "catalog", label: "Card Database", file: "catalog.html" },
    { id: "songs", label: "Discography", file: "song_overview.html" },
    { id: "kizuna", label: "Kizuna Bond", file: "kizuna.html" },
    { id: "bestteams", label: "Best Teams", file: "best_teams.html" }
  ];

  var tabsEl = document.getElementById('tabs');
  var frameWrap = document.getElementById('frame-wrap');

  pages.forEach(function (page, i) {
    var tab = document.createElement('button');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = page.label;
    tabsEl.appendChild(tab);

    var iframe = document.createElement('iframe');
    iframe.className = i === 0 ? 'active' : '';
    iframe.src = page.file;
    iframe.title = page.label;
    frameWrap.appendChild(iframe);

    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('iframe').forEach(function (f) { f.classList.remove('active'); });
      tab.classList.add('active');
      iframe.classList.add('active');
    });
  });
</script>
</body>
</html>
