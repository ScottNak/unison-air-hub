<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UNI'S ON AIR — Public Hub</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    background: linear-gradient(135deg, #1a1a2e, #16213e 60%, #0f3460);
  }
  header { padding: 20px 16px 0; flex: none; position: relative; }
  h1 { color: #fff; text-align: center; font-size: 24px; margin: 0 0 16px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }

  .gear-btn {
    position: absolute; top: 14px; right: 16px; z-index: 21;
    width: 34px; height: 34px; padding: 0; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, transform .18s ease;
  }
  .gear-btn:hover { background: rgba(255,255,255,0.26); }
  .gear-btn.open { transform: rotate(45deg); background: rgba(255,255,255,0.26); }

  .gear-menu {
    display: none; flex-direction: column; gap: 8px;
    position: absolute; top: 52px; right: 16px; z-index: 20; min-width: 190px;
    background: #fff; border-radius: 10px; padding: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .gear-menu.open { display: flex; }
  .gear-menu .save-btn {
    appearance: none; border: none; cursor: pointer; font-weight: 700; font-size: 12.5px;
    padding: 8px 12px; border-radius: 8px; background: #eceef4; color: #2d2d42; text-align: left;
    transition: background .12s ease;
  }
  .gear-menu .save-btn:hover { background: #dde1ec; }
  .gear-menu .save-note { color: #555; font-size: 11.5px; min-height: 14px; }

  .tabs {
    display: flex; justify-content: center; gap: 8px; padding: 0 16px 16px;
    flex: none; flex-wrap: wrap;
  }
  .tab {
    appearance: none; border: none; cursor: pointer; font-weight: 700; font-size: 13px;
    padding: 10px 18px; border-radius: 10px 10px 0 0;
    background: rgba(255,255,255,0.55); color: #2d2d42;
    transition: background .12s ease, color .12s ease;
  }
  .tab.active { background: #fff; color: #2d2d42; }
  .tab:not(.active):hover { background: rgba(255,255,255,0.75); }

  .frame-wrap { flex: 1 1 auto; background: #fff; margin: 0 16px 16px; border-radius: 0 12px 12px 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35); overflow: hidden; position: relative; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none;
  }
  iframe.active { display: block; }

  /* Birthday notification (top left) */
  .bday-box {
    position: fixed; top: 14px; left: 16px; z-index: 20;
    max-width: 270px; padding: 10px 14px; border-radius: 12px;
    font-size: 12px; line-height: 1.45; color: #2d2d42;
    background: rgba(255,255,255,0.88);
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .bday-box:empty { display: none; }
  .bday-entry + .bday-entry {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(45,45,66,0.25);
  }
  .bday-name.sakura { color: #c2185b; font-weight: 700; }
  .bday-name.hinata { color: #0d6fa8; font-weight: 700; }
  .bday-code {
    display: inline-block; margin-top: 3px; font-family: Consolas, 'SFMono-Regular', monospace;
    font-weight: 700; font-size: 11.5px; text-decoration: none; padding: 2px 8px; border-radius: 6px;
    border: 1px solid transparent; cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, background .1s ease;
  }
  .bday-code::after { content: ' \2197'; font-weight: 400; }
  .bday-code:hover {
    text-decoration: underline; transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .bday-code.sakura { background: #ffe1ec; color: #c2185b; border-color: #f7b3cd; }
  .bday-code.sakura:hover { background: #ffc9dd; }
  .bday-code.hinata { background: #dcf0fd; color: #0d6fa8; border-color: #a8dbf5; }
  .bday-code.hinata:hover { background: #c3e6fb; }
</style>
</head>
<body>
<header>
  <h1>UNI'S ON AIR — Hub</h1>
  <button class="gear-btn" id="hub-gear-btn" title="Export / Import" aria-label="Export / Import" aria-haspopup="true">&#9881;</button>
  <div class="gear-menu" id="hub-gear-menu">
    <button class="save-btn" id="hub-export-btn">&#11015; Export all</button>
    <button class="save-btn" id="hub-import-btn">&#11014; Import all</button>
    <input type="file" id="hub-import-file" accept="application/json" style="display:none">
    <span class="save-note" id="hub-save-note">&nbsp;</span>
  </div>
</header>

<div class="bday-box" id="bday-box"></div>

<div class="tabs" id="tabs"></div>
<div class="frame-wrap" id="frame-wrap"></div>

<script src="member_profiles.js"></script>
<script>
  // --- Birthday notification (top left, JST) -------------------------------
  // window.UNIAIR_MEMBER_PROFILES (member_profiles.js) holds all 97 members
  // keyed by Japanese name: {english:{family,given}, birthday, group,
  // graduated, gen, order}. Filtered here to the active roster
  // (graduated === false - this also naturally excludes every K-group
  // member, since all 6 are already graduated) and reshaped into the
  // {jp, given, family, birthdate, group} array this widget already works
  // with (previously precomputed into a separate birthdays.js by
  // generate_birthdays_js.py - folded in here 2026-08-04 since it was just a
  // filtered view of the same source, no separate file needed). "Today" is
  // computed in Japan time regardless of the visitor's local timezone. Ties
  // (two+ members sharing a date) are shown stacked, each with its own
  // line/code. No lang toggle on this public hub, so names are always shown
  // romanized (Given Family).
  (function () {
    function renderBday() {
      var box = document.getElementById('bday-box');
      var profiles = (typeof window.UNIAIR_MEMBER_PROFILES !== 'undefined') ? window.UNIAIR_MEMBER_PROFILES : null;
      var BD = null;
      if (profiles) {
        BD = [];
        for (var jp in profiles) {
          if (!profiles.hasOwnProperty(jp)) continue;
          var e = profiles[jp];
          if (e.graduated) continue;
          BD.push({ jp: jp, given: e.english.given, family: e.english.family, birthdate: e.birthday, group: e.group });
        }
      }
      if (!box) return;
      box.innerHTML = '';
      if (!BD || !BD.length) return;

      var jstFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' });
      var todayParts = jstFmt.format(new Date()).split('-'); // en-CA => YYYY-MM-DD
      var todayY = +todayParts[0], todayM = +todayParts[1], todayD = +todayParts[2];

      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function mmdd(m, d) { return pad2(m) + pad2(d); }
      function ordinal(n) {
        var rem100 = n % 100;
        if (rem100 >= 11 && rem100 <= 13) return n + 'TH';
        if (n % 10 === 1) return n + 'ST';
        if (n % 10 === 2) return n + 'ND';
        if (n % 10 === 3) return n + 'RD';
        return n + 'TH';
      }
      function initials(e) { return (e.given.charAt(0) + e.family.charAt(0)).toUpperCase(); }
      function displayName(e) { return e.given + ' ' + e.family; }
      function groupClass(e) { return e.group === 'S' ? 'sakura' : 'hinata'; }
      // Days from today to (m, d), ignoring year, using a fixed non-leap
      // reference year so the diff is stable (0 = today, wraps to next year).
      function daysUntil(m, d) {
        var ref = 2001;
        var t0 = Date.UTC(ref, todayM - 1, todayD);
        var t1 = Date.UTC(ref, m - 1, d);
        var diff = Math.round((t1 - t0) / 86400000);
        if (diff < 0) diff += 365;
        return diff;
      }

      var todayKey = mmdd(todayM, todayD);
      var todays = BD.filter(function (e) {
        var p = e.birthdate.split('-');
        return mmdd(+p[1], +p[2]) === todayKey;
      });

      if (todays.length) {
        todays.forEach(function (e) {
          var p = e.birthdate.split('-');
          var age = todayY - (+p[0]);
          var code = 'HBD' + ordinal(age) + mmdd(+p[1], +p[2]) + initials(e);
          var gc = groupClass(e);
          var div = document.createElement('div');
          div.className = 'bday-entry';
          div.innerHTML = '🎂 Happy Birthday to <span class="bday-name ' + gc + '">' + displayName(e) + '</span>!<br>' +
            '<a class="bday-code ' + gc + '" href="https://app-pay.jp/checkout/present" target="_blank" rel="noopener">' + code + '</a>';
          box.appendChild(div);
        });
      } else {
        var bestDiff = Infinity, upcoming = [];
        BD.forEach(function (e) {
          var p = e.birthdate.split('-');
          var diff = daysUntil(+p[1], +p[2]);
          if (diff < bestDiff) { bestDiff = diff; upcoming = [e]; }
          else if (diff === bestDiff) { upcoming.push(e); }
        });
        upcoming.forEach(function (e) {
          var p = e.birthdate.split('-');
          var gc = groupClass(e);
          var div = document.createElement('div');
          div.className = 'bday-entry';
          div.innerHTML = 'Next Birthday is ' + mmdd(+p[1], +p[2]) + ': <span class="bday-name ' + gc + '">' + displayName(e) + '</span>';
          box.appendChild(div);
        });
      }
    }

    renderBday();
    // Refresh hourly so a page left open overnight rolls to the new JST day.
    setInterval(renderBday, 60 * 60 * 1000);
  })();
</script>
<script>
  // Public hub pages. Update the "file" field here if a page is renamed/replaced.
  var pages = [
    { id: "catalog", label: "Card Database", file: "catalog.html" },
    { id: "songs", label: "Discography", file: "song_overview.html" },
    { id: "kizuna", label: "Kizuna Bond", file: "kizuna.html" },
    { id: "bestteams", label: "Best Teams", file: "best_teams.html" },
    { id: "spotlight", label: "Spotlight", file: "spotlight.html" }
  ];

  var tabsEl = document.getElementById('tabs');
  var frameWrap = document.getElementById('frame-wrap');
  var iframes = []; // parallel array to `pages`, filled below

  pages.forEach(function (page, i) {
    var tab = document.createElement('button');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = page.label;
    tabsEl.appendChild(tab);

    var iframe = document.createElement('iframe');
    iframe.className = i === 0 ? 'active' : '';
    iframe.src = page.file;
    iframe.title = page.label;
    frameWrap.appendChild(iframe);
    iframes.push(iframe);

    tab.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('iframe').forEach(function (f) { f.classList.remove('active'); });
      tab.classList.add('active');
      iframe.classList.add('active');
    });
  });

  // --- Combined Export/Import -----------------------------------------
  // Each tab (catalog/songs/kizuna) used to have its own Export/Import
  // button and file. As of 2026-08 that's consolidated here: the hub
  // broadcasts a postMessage request to every tab's iframe (all 4 are
  // already loaded above, not lazy-loaded on tab click, so every tab can
  // answer immediately regardless of which one is currently visible),
  // collects the replies, and reads/writes the SAME localStorage keys +
  // file shapes each tab always used (owned/bond/discography) - so a file
  // saved here still round-trips with Scott's personal Kizuna/Discography
  // tools, and an old single-tab export/import file still loads fine here
  // too. best_teams.html doesn't own any data itself (it only reads the
  // other three tabs' localStorage), so it's not part of the message
  // protocol - it just gets reloaded after an Import like the other tabs,
  // so it re-reads the fresh values.
  // Gear menu: Export/Import used to sit as always-visible buttons in the
  // header, tucked behind this icon per Scott's request so the header stays
  // clean. Pure show/hide, no framework needed.
  var gearBtn = document.getElementById('hub-gear-btn');
  var gearMenu = document.getElementById('hub-gear-menu');
  gearBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    gearBtn.classList.toggle('open');
    gearMenu.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (!gearMenu.classList.contains('open')) return;
    if (gearMenu.contains(e.target) || e.target === gearBtn) return;
    gearBtn.classList.remove('open');
    gearMenu.classList.remove('open');
  });

  var MSG_TIMEOUT_MS = 900;
  var noteEl = document.getElementById('hub-save-note');
  var noteTimer = null;
  function flashNote(msg, holdMs) {
    noteEl.textContent = msg;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { noteEl.textContent = ' '; }, holdMs || 6000);
  }

  function pageIndexForWindow(win) {
    for (var i = 0; i < iframes.length; i++) { if (iframes[i].contentWindow === win) return i; }
    return -1;
  }

  // Broadcasts {type, id, ...extra} to every iframe and collects replies of
  // the given replyType that carry a matching id, keyed by page id.
  function broadcastAndCollect(type, extra, replyType, cb) {
    var id = type + '-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    var replies = {};
    function onMessage(e) {
      var msg = e.data;
      if (!msg || typeof msg !== 'object' || msg.id !== id || msg.type !== replyType) return;
      var idx = pageIndexForWindow(e.source);
      if (idx === -1) return;
      replies[pages[idx].id] = msg;
    }
    window.addEventListener('message', onMessage);
    var payload = Object.assign({ type: type, id: id }, extra || {});
    iframes.forEach(function (f) {
      try { f.contentWindow.postMessage(payload, '*'); } catch (err) { /* not loaded yet */ }
    });
    setTimeout(function () {
      window.removeEventListener('message', onMessage);
      cb(replies);
    }, MSG_TIMEOUT_MS);
  }

  function missingLabels(replies) {
    // best_teams.html and spotlight.html never answer (neither owns a
    // snapshot of its own - both are pure readers of the other tabs'
    // localStorage, plus spotlight.html's own member-picker/bonus-list
    // settings, which aren't part of this Export/Import) - don't report
    // them as "missing".
    var silent = { bestteams: true, spotlight: true };
    return pages
      .filter(function (p) { return !silent[p.id] && !(p.id in replies); })
      .map(function (p) { return p.label; });
  }

  document.getElementById('hub-export-btn').addEventListener('click', function () {
    flashNote('Gathering data from every tab…', 4000);
    broadcastAndCollect('uniair-request-snapshot', null, 'uniair-snapshot', function (replies) {
      var snapshot = { savedAt: new Date().toISOString(), source: 'uniair_public_hub' };
      if (replies.catalog) snapshot.owned = replies.catalog.owned || [];
      if (replies.kizuna) snapshot.bond = replies.kizuna.bond || {};
      if (replies.songs) snapshot.discography = replies.songs.discography || {};

      var stamp = new Date().toISOString().slice(0, 10);
      var filename = 'uniair_public_save_' + stamp + '.json';
      var blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);

      var missing = missingLabels(replies);
      if (missing.length) {
        flashNote('Saved to ' + filename + ' - but no reply from: ' + missing.join(', ') + ' (give those tabs a moment to finish loading, then try again if their data matters).', 9000);
      } else {
        flashNote('Saved to ' + filename);
      }
    });
  });

  var importFileInput = document.getElementById('hub-import-file');
  document.getElementById('hub-import-btn').addEventListener('click', function () {
    importFileInput.click();
  });
  importFileInput.addEventListener('change', function (e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(reader.result); }
      catch (err) { window.alert('That file is not valid JSON - could not load.'); return; }

      // Backward-compat: catalog.html's old standalone export was a bare
      // array of {member, title}, not wrapped in {owned: [...]}.
      if (Array.isArray(data)) data = { owned: data };

      var hasOwned = Array.isArray(data.owned) && data.owned.length > 0;
      var hasBond = data.bond || data.values;
      var hasDisco = data.discography;
      if (!hasOwned && !hasBond && !hasDisco) {
        window.alert('That file does not look like a UNI\'S ON AIR save file.');
        return;
      }

      var parts = [];
      if (hasOwned) parts.push('merge in owned-card marks (never unmarks anything)');
      if (hasBond) parts.push('overwrite Kizuna bond values for every member listed');
      if (hasDisco) parts.push('overwrite Discography levels for every song listed');
      var msg = 'Import from "' + file.name + '"? This will:\n\n• ' + parts.join('\n• ') + '\n\nEverything not mentioned in the file is left untouched.';
      if (!window.confirm(msg)) return;

      broadcastAndCollect('uniair-import-data', { data: data }, 'uniair-import-ack', function (replies) {
        var summary = [];
        if (replies.catalog) summary.push('Owned +' + (replies.catalog.changed || 0));
        if (replies.kizuna) summary.push('Kizuna ' + (replies.kizuna.changed || 0) + ' updated');
        if (replies.songs) summary.push('Discography ' + (replies.songs.changed || 0) + ' updated');

        // Reload every tab so it re-reads localStorage fresh - the safety
        // net that makes this reliable even if a tab's ack got lost, and
        // the only way best_teams.html (a pure reader) ever picks up the
        // change, since it computes everything once at load time.
        iframes.forEach(function (f) { f.src = f.src; });

        var missing = missingLabels(replies);
        var note = summary.length ? ('Imported: ' + summary.join(', ') + '.') : 'Imported.';
        if (missing.length) note += ' No reply from: ' + missing.join(', ') + ' (reloaded anyway).';
        flashNote(note, 9000);
      });
    };
    reader.readAsText(file);
  });
</script>
</body>
</html>
