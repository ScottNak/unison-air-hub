function buildPool() {

    var song = c.title;

    return {
      key: c.member + '|' + c.title,
      
      
      id: c.id, baseId: c.baseId,

      sk: c.sk, vo: c.vo, da: c.da, pe: c.pe,
      k: 0,

  });
}

function skNum(sk) { return (sk === null || sk === undefined || sk === 'FLEEK!') ? 0 : sk; }

function isRegularSkill(centerSkill) {
  var v = SKILL_LOOKUP[centerSkill];
  if (!v) return false;
  var nz = v.filter(function(x) { return x; });
  var uniq = {};
  nz.forEach(function(x) { uniq[x] = 1; });
  return Object.keys(uniq).length <= 1;
}

function effectVal(s, p, t, X, Y, mult) {
  X = X || 0; Y = Y || 0; mult = (mult === undefined) ? 1.0 : mult;
  var pp = p * mult / 100;
  if (Y === 0) return pp * t * X / (pp * t + s);
  if (X === 0) return pp * t * (Y / 3) / (pp * t + s);
  return pp * t * (X + Y / 3 + X * Y / 300) / (pp * t + s);
}

function round6(x) { return Math.round(x * 1e6) / 1e6; }

function boostedSk(rawSk, mult, card) {
  if (rawSk === null || rawSk === undefined || rawSk === 'FLEEK!' || rawSk === 0) return rawSk;
  var params = card ? SK_OVERRIDES[card.key] : null;
  if (!params) params = SK_PARAMS[String(round6(rawSk))];
  if (!params) return rawSk;
  if (params.type === 'single') {
    return effectVal(params.s, params.p, params.t, params.X, params.Y, mult) / 100;
  }
  var e1 = effectVal(params.e1.s, params.e1.p, params.e1.t, params.e1.X, params.e1.Y, mult);
  var e2 = effectVal(params.e2.s, params.e2.p, params.e2.t, params.e2.X, params.e2.Y, mult);
  return (e1 + e2) / 100;
}




function engineScore(vo, da, pe, member, kBonus, lsvo, lsda, lspe, teamSkSum, ctx) {
  var base = vo + da + pe;
  var subskill = vo * 0.05 * B3 + da * 0.05 * B4 + pe * 0.05 * B5;
  var totalBonus = ctx.memberBonusMap[member] || 0;
  var mp = totalBonus + 430 + COSTUME_DEFAULT;
  var k = kBonus || 0;
  var nstats = [lsvo, lsda, lspe].filter(function(x) { return x; }).length;
  var main, extra;
  if (nstats === 3) {
    main = base * (1 + 0.05 + B2 * 0.01 + 0.3) + subskill + mp + k;
    extra = vo * lsvo + da * lsda + pe * lspe;
  } else if (nstats === 2) {
    main = base * (1 + B2 * 0.01 + 0.3) + subskill + mp + k;
    extra = vo * lsvo + da * lsda + pe * lspe;
    if (lsvo) extra += vo * 0.08;
    if (lsda) extra += da * 0.08;
    if (lspe) extra += pe * 0.08;
  } else if (nstats === 1) {
    main = base * (1 + 0.05 + B2 * 0.01 + 0.3) + subskill + mp + k;
    extra = lsvo ? vo * lsvo : (lsda ? da * lsda : pe * lspe);
  } else {
    main = base * (1 + 0.05 + B2 * 0.01 + 0.3) + subskill + mp + k;
    extra = 0;
  }
  var total = (main + extra) + ctx.b8 + B1 * 0.08;
  return Math.round(total * (1 + teamSkSum));
}

function normalTeamScored(leader, supports, lsvo, lsda, lspe, ctx) {
  var team = [leader].concat(supports);
  var teamSkSum = team.reduce(function(s, c) { return s + skNum(c.sk); }, 0);
  var leaderScore = engineScore(leader.vo * STATUS_BONUS, leader.da * STATUS_BONUS, leader.pe * STATUS_BONUS,
                                 leader.member, leader.k, lsvo, lsda, lspe, teamSkSum, ctx);
  var scoredSupports = supports.map(function(c) {
    return [engineScore(c.vo * STATUS_BONUS, c.da * STATUS_BONUS, c.pe * STATUS_BONUS,
                         c.member, c.k, lsvo, lsda, lspe, teamSkSum, ctx), c];
  });
  var teamTotal = leaderScore + scoredSupports.reduce(function(s, x) { return s + x[0]; }, 0);
  return {leaderScore: leaderScore, scoredSupports: scoredSupports, teamTotal: teamTotal};
}

function normalTeamTotal(leader, supports, lsvo, lsda, lspe, ctx) {
  return normalTeamScored(leader, supports, lsvo, lsda, lspe, ctx).teamTotal;
}



function greedySplit(candidatesInOrder) {
  var chosen = [], usedGroups = {}, remaining = [];
  candidatesInOrder.forEach(function(c) {
    if (chosen.length < 4 && !usedGroups[c.groupKey]) {
      chosen.push(c); usedGroups[c.groupKey] = true;
    } else {
      remaining.push(c);
    }
  });
  return [chosen, remaining];
}

function swapRefine(chosen, remaining, totalFn) {
  chosen = chosen.slice(); remaining = remaining.slice();
  var bestTotal = totalFn(chosen);
  var improved = true, iterations = 0;
  while (improved && iterations < 8) {
    improved = false; iterations++;
    for (var i = 0; i < chosen.length; i++) {
      var bestSwap = null;
      for (var j = 0; j < remaining.length; j++) {
        var candidateGroup = remaining[j].groupKey;
        var conflict = false;
        for (var k2 = 0; k2 < chosen.length; k2++) {
          if (k2 !== i && chosen[k2].groupKey === candidateGroup) { conflict = true; break; }
        }
        if (conflict) continue;
        var trial = chosen.slice(0, i).concat(chosen.slice(i + 1)).concat([remaining[j]]);
        var total = totalFn(trial);
        if (total > bestTotal) { bestTotal = total; bestSwap = j; }
      }
      if (bestSwap !== null) {
        var old = chosen[i];
        chosen[i] = remaining[bestSwap];
        remaining[bestSwap] = old;
        improved = true;
      }
    }
  }
  return [chosen, bestTotal];
}




function seededRng(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rng) {
  arr = arr.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function multiRestartOptimize(candidates, totalFn, primarySeedKey) {
  var orderings = [];
  orderings.push(candidates.slice().sort(function(a, b) { return primarySeedKey(b) - primarySeedKey(a); }));
  orderings.push(candidates.slice().sort(function(a, b) {
    return ((b.vo || 0) + (b.da || 0) + (b.pe || 0)) - ((a.vo || 0) + (a.da || 0) + (a.pe || 0));
  }));
  var rng = seededRng(1234);
  for (var s = 0; s < 4; s++) orderings.push(shuffleArr(candidates, rng));

  var bestChosen = null, bestTotal = null;
  orderings.forEach(function(order) {
    var split = greedySplit(order);
    var refined = swapRefine(split[0], split[1], totalFn);
    if (bestTotal === null || refined[1] > bestTotal) { bestChosen = refined[0]; bestTotal = refined[1]; }
  });
  return [bestChosen, bestTotal];
}


function bestNormalTeam(pool, ctx) {
  if (!pool.length) return null;
  var candidateSkillSet = {};
  pool.forEach(function(c) { if (isRegularSkill(c.centerSkill)) candidateSkillSet[c.centerSkill] = true; });
  var skills = Object.keys(candidateSkillSet).sort();
  var best = null;
  skills.forEach(function(skillText) {
    var shape = SKILL_LOOKUP[skillText];
    var lsvo = shape[0], lsda = shape[1], lspe = shape[2];
    function seedScore(c) {
      return engineScore(c.vo * STATUS_BONUS, c.da * STATUS_BONUS, c.pe * STATUS_BONUS,
                          c.member, c.k, lsvo, lsda, lspe, SEED_SK_ESTIMATE, ctx);
    }
    var centerCandidates = pool.filter(function(c) { return c.centerSkill === skillText; });
    if (!centerCandidates.length) return;
    var centerCard = centerCandidates[0], centerCardScore = seedScore(centerCard);
    centerCandidates.forEach(function(c) {
      var s = seedScore(c);
      if (s > centerCardScore) { centerCard = c; centerCardScore = s; }
    });

    var supportPoolFull = pool.filter(function(c) { return c.key !== centerCard.key && c.groupKey !== centerCard.groupKey; });
    var supportPool = supportPoolFull.slice().sort(function(a, b) { return seedScore(b) - seedScore(a); })
      .slice(0, NORMAL_SUPPORT_SHORTLIST_SIZE);

    function totalFn(supports) { return normalTeamTotal(centerCard, supports, lsvo, lsda, lspe, ctx); }

    var chosenSupports, teamTotal;
    if (supportPool.length < 4) {
      chosenSupports = supportPool; teamTotal = totalFn(supportPool);
    } else {
      var r = multiRestartOptimize(supportPool, totalFn, seedScore);
      chosenSupports = r[0]; teamTotal = r[1];
    }
    var scored = normalTeamScored(centerCard, chosenSupports, lsvo, lsda, lspe, ctx);
    if (!best || scored.teamTotal > best.teamTotal) {
      best = {skillText: skillText, teamTotal: scored.teamTotal, center: [scored.leaderScore, centerCard], supports: scored.scoredSupports};
    }
  });
  return best;
}








function bestSupportsForLeader(centerCard, lsvo, lsda, lspe, pool, ctx) {
  var candidatesFull = pool.filter(function(c) { return c.key !== centerCard.key && c.groupKey !== centerCard.groupKey; });
  function seedScore(c) {
    return engineScore(c.vo * STATUS_BONUS, c.da * STATUS_BONUS, c.pe * STATUS_BONUS,
                        c.member, c.k, lsvo, lsda, lspe, SEED_SK_ESTIMATE, ctx);
  }
  var candidates = candidatesFull.slice().sort(function(a, b) { return seedScore(b) - seedScore(a); })
    .slice(0, NORMAL_SUPPORT_SHORTLIST_SIZE);
  if (candidates.length < 4) return candidates;
  function totalFn(supports) { return normalTeamTotal(centerCard, supports, lsvo, lsda, lspe, ctx); }
  return multiRestartOptimize(candidates, totalFn, seedScore)[0];
}

function veautTeamStats(leader, chosenSupports) {
  var shape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
  var lVo = shape[0], lDa = shape[1], lPe = shape[2];
  var nstats = [lVo, lDa, lPe].filter(function(x) { return x; }).length;
  var mult = SHAPE_MULT[nstats];
  var openVo = lVo !== 0, openDa = lDa !== 0, openPe = lPe !== 0;
  var party = [leader].concat(chosenSupports);
  var confirmed = VEAUT_CONFIRMED[leader.member];
  var activationMult = 1 + mult;
  var contributors, zeroClosedStats;
  if (confirmed) {
    contributors = party.filter(function(c) { return confirmed.pairColors.indexOf(c.color) !== -1; });
    zeroClosedStats = true;
  } else {
    contributors = party;
    zeroClosedStats = false;
  }
  var sumVo = openVo ? contributors.reduce(function(s, c) { return s + contribSkill(c)[0]; }, 0) : 0;
  var sumDa = openDa ? contributors.reduce(function(s, c) { return s + contribSkill(c)[1]; }, 0) : 0;
  var sumPe = openPe ? contributors.reduce(function(s, c) { return s + contribSkill(c)[2]; }, 0) : 0;
  return {teamLsvo: mult * sumVo, teamLsda: mult * sumDa, teamLspe: mult * sumPe,
           activationMult: activationMult, zeroClosedStats: zeroClosedStats,
           openVo: openVo, openDa: openDa, openPe: openPe};
}

function veautTeamTotal(leader, chosenSupports, ctx) {
  var st = veautTeamStats(leader, chosenSupports);
  function statIn(c) {
    var vo = c.vo * STATUS_BONUS, da = c.da * STATUS_BONUS, pe = c.pe * STATUS_BONUS;
    if (st.zeroClosedStats) {
      vo = st.openVo ? vo : 0; da = st.openDa ? da : 0; pe = st.openPe ? pe : 0;
    }
    return [vo, da, pe];
  }
  var leaderSk = boostedSk(leader.sk, st.activationMult, leader);
  var supportSks = chosenSupports.map(function(c) {
    return c.member === leader.member ? boostedSk(c.sk, st.activationMult, c) : c.sk;
  });
  var teamSkSum = skNum(leaderSk) + supportSks.reduce(function(s, sk) { return s + skNum(sk); }, 0);
  var lstat = statIn(leader);
  var total = engineScore(lstat[0], lstat[1], lstat[2], leader.member, leader.k, st.teamLsvo, st.teamLsda, st.teamLspe, teamSkSum, ctx);
  chosenSupports.forEach(function(c) {
    var s = statIn(c);
    total += engineScore(s[0], s[1], s[2], c.member, c.k, st.teamLsvo, st.teamLsda, st.teamLspe, teamSkSum, ctx);
  });
  return total;
}

    return [candidates, candidates.length ? veautTeamTotal(leader, candidates, ctx) : null];
  }
  var shape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
  function seedKey(c) {
    return engineScore(c.vo * STATUS_BONUS, c.da * STATUS_BONUS, c.pe * STATUS_BONUS,
                        c.member, c.k, shape[0], shape[1], shape[2], SEED_SK_ESTIMATE, ctx);
  }
  function totalFn(supports) { return veautTeamTotal(leader, supports, ctx); }
  return multiRestartOptimize(candidates, totalFn, seedKey);
}


function stellerTeamStats(leader, chosenSupports) {
  var party = [leader].concat(chosenSupports);
  var info = STELLER_INFO[leader.centerSkill];
  var code = info ? info.code : null;
  var variant = code ? STELLER_CODE_INFO[code] : null;

  if (!variant) {
    var shape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
    var nstats = shape.filter(function(x) { return x; }).length;
    var mult = SHAPE_MULT[nstats] || 0.7;
    var openVo = shape[0] !== 0, openDa = shape[1] !== 0, openPe = shape[2] !== 0;
    var sumVo = openVo ? party.reduce(function(s, c) { return s + contribSkill(c)[0]; }, 0) : 0;
    var sumDa = openDa ? party.reduce(function(s, c) { return s + contribSkill(c)[1]; }, 0) : 0;
    var sumPe = openPe ? party.reduce(function(s, c) { return s + contribSkill(c)[2]; }, 0) : 0;
    return {teamLsvo: mult * sumVo, teamLsda: mult * sumDa, teamLspe: mult * sumPe, skBoostMult: null,
             zeroClosedStats: false, openVo: openVo, openDa: openDa, openPe: openPe};
  }

  var mult = variant.mult;
  var contributors = party.filter(function(c) { return c.color === leader.color; });

  if (variant.allmax) {
    var idxMap = {vo: 0, da: 1, pe: 2};
    var vals = {};
    ['vo', 'da', 'pe'].forEach(function(stat) {
      var idx = idxMap[stat];
      vals[stat] = contributors.length ? Math.max.apply(null, contributors.map(function(c) { return contribSkill(c)[idx]; })) : 0;
    });
    var skMax = 0;
    contributors.forEach(function(c) {
      var si = STELLER_INFO[c.centerSkill];
      var v = si ? (si.sk_hatsu || 0) : 0;
      if (v > skMax) skMax = v;
    });
    var skBoostMult = skMax ? skMax * variant.sk_mult : null;
    return {teamLsvo: mult * vals.vo, teamLsda: mult * vals.da, teamLspe: mult * vals.pe, skBoostMult: skBoostMult,
             zeroClosedStats: false, openVo: true, openDa: true, openPe: true};
  }

  var openVo = variant.stats.indexOf('vo') !== -1;
  var openDa = variant.stats.indexOf('da') !== -1;
  var openPe = variant.stats.indexOf('pe') !== -1;
  var idxMap2 = {vo: 0, da: 1, pe: 2};
  var sums = {vo: 0, da: 0, pe: 0};
  variant.stats.forEach(function(stat) {
    var idx = idxMap2[stat];
    sums[stat] = contributors.reduce(function(s, c) { return s + contribSkill(c)[idx]; }, 0);
  });
  return {teamLsvo: mult * sums.vo, teamLsda: mult * sums.da, teamLspe: mult * sums.pe, skBoostMult: null,
           zeroClosedStats: true, openVo: openVo, openDa: openDa, openPe: openPe};
}

function stellerTeamTotal(leader, chosenSupports, ctx) {
  var st = stellerTeamStats(leader, chosenSupports);
  function statIn(c) {
    var vo = c.vo * STATUS_BONUS, da = c.da * STATUS_BONUS, pe = c.pe * STATUS_BONUS;
    if (st.zeroClosedStats) { vo = st.openVo ? vo : 0; da = st.openDa ? da : 0; pe = st.openPe ? pe : 0; }
    return [vo, da, pe];
  }
  var leaderSk = st.skBoostMult ? boostedSk(leader.sk, st.skBoostMult, leader) : leader.sk;
  var supportSks = chosenSupports.map(function(c) {
    return st.skBoostMult ? boostedSk(c.sk, st.skBoostMult, c) : c.sk;
  });
  var teamSkSum = skNum(leaderSk) + supportSks.reduce(function(s, sk) { return s + skNum(sk); }, 0);
  var lstat = statIn(leader);
  var total = engineScore(lstat[0], lstat[1], lstat[2], leader.member, leader.k, st.teamLsvo, st.teamLsda, st.teamLspe, teamSkSum, ctx);
  chosenSupports.forEach(function(c) {
    var s = statIn(c);
    total += engineScore(s[0], s[1], s[2], c.member, c.k, st.teamLsvo, st.teamLsda, st.teamLspe, teamSkSum, ctx);
  });
  return total;
}

function optimizeStellerTeam(leader, pool, ctx) {
  var candidates = pool.filter(function(c) { return c.key !== leader.key && c.groupKey !== leader.groupKey; });
  if (candidates.length < 4) {
    return [candidates, candidates.length ? stellerTeamTotal(leader, candidates, ctx) : null];
  }
  var info = STELLER_INFO[leader.centerSkill];
  var code = info ? info.code : null;
  var seedShape;
  if (code && STELLER_CODE_INFO[code] && STELLER_CODE_INFO[code].allmax) {
    var m = STELLER_CODE_INFO['AB'].mult;
    seedShape = [m, m, m];
  } else {
    seedShape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
  }
  function seedKey(c) {
    return engineScore(c.vo * STATUS_BONUS, c.da * STATUS_BONUS, c.pe * STATUS_BONUS,
                        c.member, c.k, seedShape[0], seedShape[1], seedShape[2], SEED_SK_ESTIMATE, ctx);
  }
  function totalFn(supports) { return stellerTeamTotal(leader, supports, ctx); }
  return multiRestartOptimize(candidates, totalFn, seedKey);
}











function skPctText(sk) {
  if (sk === null || sk === undefined) return '—';
  if (sk === 'FLEEK!') return 'FLEEK!';
  return (sk * 100).toFixed(2) + '%';
}









function shortSkillText(cs) {
  if (!cs) return cs;
  var idx = cs.indexOf('+');
  return idx !== -1 ? cs.slice(0, idx) : cs;
}








function effectiveSkillLabel(mech, leader, supports) {
  var teamLsvo, teamLsda, teamLspe, openVo, openDa, openPe, activationNote;
  if (mech === 'veaut') {
    var vst = veautTeamStats(leader, supports);
    teamLsvo = vst.teamLsvo; teamLsda = vst.teamLsda; teamLspe = vst.teamLspe;
    openVo = vst.openVo; openDa = vst.openDa; openPe = vst.openPe;
    activationNote = 'SK ×' + vst.activationMult.toFixed(1) + ' for ' + leader.member + "'s own cards in the party";
  } else if (mech === 'steller') {
    var sst = stellerTeamStats(leader, supports);
    teamLsvo = sst.teamLsvo; teamLsda = sst.teamLsda; teamLspe = sst.teamLspe;
    openVo = sst.openVo; openDa = sst.openDa; openPe = sst.openPe;
    activationNote = sst.skBoostMult ? ('SK ×' + sst.skBoostMult.toFixed(2) + ' for the whole party (AllMax)') : null;
  } else {
    var shape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
    teamLsvo = shape[0]; teamLsda = shape[1]; teamLspe = shape[2];
    openVo = shape[0] !== 0; openDa = shape[1] !== 0; openPe = shape[2] !== 0;
    activationNote = null;
  }
  var parts = [];
  if (openVo) parts.push('Vo ' + (teamLsvo * 100).toFixed(1) + '%');
  if (openDa) parts.push('Da ' + (teamLsda * 100).toFixed(1) + '%');
  if (openPe) parts.push('Pe ' + (teamLspe * 100).toFixed(1) + '%');
  var statStr = parts.length ? parts.join(' ') : '—';
  return activationNote ? (statStr + ' — ' + activationNote) : statStr;
}

function buildDisplayRows(mech, leader, supports) {
  var boostFor = function() { return null; };
  if (mech === 'veaut') {
    var vst = veautTeamStats(leader, supports);
    boostFor = function(c) { return c.member === leader.member ? vst.activationMult : null; };
  } else if (mech === 'steller') {
    var sst = stellerTeamStats(leader, supports);
    if (sst.skBoostMult) boostFor = function() { return sst.skBoostMult; };
  }
  function row(isLeader, c) {
    var mult = boostFor(c);
    var before = skPctText(c.sk);
    var after = (mult && c.sk !== null && c.sk !== undefined && c.sk !== 'FLEEK!') ? skPctText(boostedSk(c.sk, mult, c)) : null;
    return {isLeader: isLeader, member: c.member, song: c.song, color: c.color,
             centerSkill: shortSkillText(c.centerSkill), skBefore: before, skAfter: after};
  }
  var rows = [row(true, leader)];
  supports.forEach(function(c) { rows.push(row(false, c)); });
  return rows;
}












function classifyAcquisition(card, ownedSet) {
  if (!card.baseId) return {tag: 'Pull'};
  if (ownedSet[card.baseId]) return {tag: 'Upgrade', note: 'you already own the base card'};
  return {tag: 'Pull + Upgrade', note: 'base card not owned yet either'};
}









function shortlistForRecommend(leader, fullPool, seedShape, ctx) {
  var candidates = fullPool.filter(function(c) { return c.key !== leader.key && c.groupKey !== leader.groupKey; });
  function seedScore(c) {
    return engineScore(c.vo * STATUS_BONUS, c.da * STATUS_BONUS, c.pe * STATUS_BONUS,
                        c.member, c.k, seedShape[0], seedShape[1], seedShape[2], SEED_SK_ESTIMATE, ctx);
  }
  return candidates.slice().sort(function(a, b) { return seedScore(b) - seedScore(a); })
    .slice(0, NORMAL_SUPPORT_SHORTLIST_SIZE);
}

function recommendCardsWorthGetting(mech, leader, actualSupports, fullPool, ownedSet, ctx) {
  var idealSupports;
  if (mech === 'normal') {
    var shape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
    idealSupports = bestSupportsForLeader(leader, shape[0], shape[1], shape[2], fullPool, ctx);
  } else if (mech === 'veaut') {
    var vShape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
    idealSupports = optimizeVeautTeam(leader, shortlistForRecommend(leader, fullPool, vShape, ctx), ctx)[0];
  } else {
    var info = STELLER_INFO[leader.centerSkill];
    var code = info ? info.code : null;
    var sShape;
    if (code && STELLER_CODE_INFO[code] && STELLER_CODE_INFO[code].allmax) {
      var m = STELLER_CODE_INFO['AB'].mult;
      sShape = [m, m, m];
    } else {
      sShape = SKILL_LOOKUP[leader.centerSkill] || [0, 0, 0];
    }
    idealSupports = optimizeStellerTeam(leader, shortlistForRecommend(leader, fullPool, sShape, ctx), ctx)[0];
  }
  var actualKeys = {};
  actualSupports.forEach(function(c) { actualKeys[c.key] = true; });
  var seenGroups = {};
  var out = [];
  (idealSupports || []).forEach(function(c) {
    if (actualKeys[c.key]) return;                            
    if (ownedSet[c.id]) return;                                
    if (c.song && (c.song.indexOf('Veaut') !== -1 || c.song === 'S.teller')) return; 
    if (c.graduated) return;                                   
    if (seenGroups[c.groupKey]) return;
    seenGroups[c.groupKey] = true;
    var info = classifyAcquisition(c, ownedSet);
    out.push({id: c.id, member: c.member, song: c.song, centerSkill: shortSkillText(c.centerSkill),
              sk: skPctText(c.sk), tag: info.tag, note: info.note || null});
  });
  return out.slice(0, 4);
}


function computeBestTeamsCore(ownedByColor, poolByColor, ownedSet, ctx) {
  var results = {};
  Object.keys(ownedByColor).forEach(function(color) {
    var ownedPool = ownedByColor[color] || [];
    var fullPool = poolByColor[color] || ownedPool;
    var normalTeam = bestNormalTeam(ownedPool, ctx);

    var veautCards = ownedPool.filter(function(c) { return c.song && c.song.indexOf('Veaut') !== -1; });
    var bestVeaut = null;
    veautCards.forEach(function(vc) {
      var r = optimizeVeautTeam(vc, ownedPool, ctx);
      if (r[1] !== null && (!bestVeaut || r[1] > bestVeaut.total)) {
        bestVeaut = {leader: vc, supports: r[0], total: r[1]};
      }
    });

    var stellerCards = ownedPool.filter(function(c) { return c.song === 'S.teller'; });
    var bestSteller = null;
    stellerCards.forEach(function(sc) {
      var r = optimizeStellerTeam(sc, ownedPool, ctx);
      if (r[1] !== null && (!bestSteller || r[1] > bestSteller.total)) {
        bestSteller = {leader: sc, supports: r[0], total: r[1]};
      }
    });

    var candidates = [];
    if (normalTeam) candidates.push(['normal', normalTeam.teamTotal]);
    if (bestVeaut) candidates.push(['veaut', bestVeaut.total]);
    if (bestSteller) candidates.push(['steller', bestSteller.total]);
    if (!candidates.length) { results[color] = null; return; }
    candidates.sort(function(a, b) { return b[1] - a[1]; });
    var winner = candidates[0][0];
    if (winner === 'veaut') {
      results[color] = {mech: 'veaut', leader: bestVeaut.leader, supports: bestVeaut.supports, total: bestVeaut.total,
                          rows: buildDisplayRows('veaut', bestVeaut.leader, bestVeaut.supports),
                          effectiveLabel: effectiveSkillLabel('veaut', bestVeaut.leader, bestVeaut.supports),
                          recommended: recommendCardsWorthGetting('veaut', bestVeaut.leader, bestVeaut.supports, fullPool, ownedSet, ctx)};
    } else if (winner === 'steller') {
      results[color] = {mech: 'steller', leader: bestSteller.leader, supports: bestSteller.supports, total: bestSteller.total,
                          rows: buildDisplayRows('steller', bestSteller.leader, bestSteller.supports),
                          effectiveLabel: effectiveSkillLabel('steller', bestSteller.leader, bestSteller.supports),
                          recommended: recommendCardsWorthGetting('steller', bestSteller.leader, bestSteller.supports, fullPool, ownedSet, ctx)};
    } else {
      var normalSupportCards = normalTeam.supports.map(function(s) { return s[1]; });
      results[color] = {mech: 'normal', skillText: normalTeam.skillText, center: normalTeam.center,
                          supports: normalTeam.supports, total: normalTeam.teamTotal,
                          rows: buildDisplayRows('normal', normalTeam.center[1], normalSupportCards),
                          effectiveLabel: effectiveSkillLabel('normal', normalTeam.center[1], normalSupportCards),
                          recommended: recommendCardsWorthGetting('normal', normalTeam.center[1], normalSupportCards, fullPool, ownedSet, ctx)};
    }
  });
  return results;
}

function runBestTeams() {
  var kizunaOverrides = loadKizunaOverrides();
  var discoOverrides = loadDiscoOverrides();
  var ownedSet = loadOwnedSet();
  var pool = buildPool();

  var allMembers = {};
  pool.forEach(function(c) { allMembers[c.member] = true; });
  var memberBonusMap = {};
  Object.keys(allMembers).forEach(function(m) {
    memberBonusMap[m] = memberBonusTotal(m, kizunaOverrides, discoOverrides);
  });
  var ctx = {memberBonusMap: memberBonusMap, b8: B8};

  var ownedByColor = {};
  var poolByColor = {};
  pool.forEach(function(c) {
    (poolByColor[c.color] = poolByColor[c.color] || []).push(c);
    if (!ownedSet[c.id]) return;
    (ownedByColor[c.color] = ownedByColor[c.color] || []).push(c);
  });
  return computeBestTeamsCore(ownedByColor, poolByColor, ownedSet, ctx);
}


var COLOR_HEX = {"R": "#e05a5a", "B": "#4a90d9", "G": "#5aa85a", "Y": "#d9b23a", "P": "#9a6bc9"};

function esc(s) {

}

function hexTint(hex, alpha) {

function snapshotOf(results) {

function diffColor(now, prev) {
  if (!now || !prev || !now.team || !prev.team) return null;
  var prevKeys = {}, nowKeys = {};
  prev.team.forEach(function(e) { prevKeys[rowKey(e.m, e.s)] = true; });
  now.team.forEach(function(e) { nowKeys[rowKey(e.m, e.s)] = true; });
  var entered = {}, enteredCount = 0, dropped = [];
  now.team.forEach(function(e) {
    if (!prevKeys[rowKey(e.m, e.s)]) { entered[rowKey(e.m, e.s)] = true; enteredCount++; }
  });
  prev.team.forEach(function(e) { if (!nowKeys[rowKey(e.m, e.s)]) dropped.push(e); });
  var prevLead = prev.lead ? rowKey(prev.lead.m, prev.lead.s) : null;
  var nowLead = now.lead ? rowKey(now.lead.m, now.lead.s) : null;
  var leadMoved = prevLead !== nowLead && !entered[nowLead];
  var prevRecs = {};
  (prev.recs || []).forEach(function(id) { prevRecs[id] = true; });
  var recIn = {}, recCount = 0;
  (now.recs || []).forEach(function(id) {
    if (!prevRecs[id]) { recIn[id] = true; recCount++; }
  });
  if (!enteredCount && !dropped.length && !leadMoved && !recCount) return null;
  return {entered: entered, dropped: dropped, leadMoved: leadMoved,
           prevLead: leadMoved ? prev.lead : null, recIn: recIn};
}

function diffAll(snap, prev) {
  var out = {};
  if (!prev) return out;
  Object.keys(snap).forEach(function(jp) {
    var d = diffColor(snap[jp], prev[jp]);
    if (d) out[jp] = d;
  });
  return out;
}

function reportNewCards() {

  var want = {};
  NEW_CARD_IDS.forEach(function(id) { want[id] = true; });
  var seen = {};
  var upgradable = 0;

  Object.keys(LAST_RESULTS).forEach(function(key) {

function init() {
  var loadingEl = document.getElementById('loading');
  var tabBar = document.getElementById('color-tab-bar');
  var panelsEl = document.getElementById('panels');

  var results;
  try {
    results = runBestTeams();
  } catch (e) {
    loadingEl.textContent = 'Something went wrong computing your teams: ' + e.message;
    loadingEl.style.display = '';
    return;
  }
  LAST_RESULTS = results;

  var snap = snapshotOf(results);
  var changes = diffAll(snap, loadSnapshot());
  saveSnapshot(snap);
  var chgByLetter = {};
  Object.keys(changes).forEach(function(jp) {
    chgByLetter[JP_TO_LETTER[jp] || jp] = changes[jp];
  });

  
  
  
  tabBar.innerHTML = '';
  panelsEl.innerHTML = '';

  var byLetter = {};
  Object.keys(results).forEach(function(jp) {
    var letter = JP_TO_LETTER[jp] || jp;
    byLetter[letter] = results[jp];
  });

  var activeColor = (lastActiveColor && COLOR_ORDER.indexOf(lastActiveColor) !== -1) ? lastActiveColor : COLOR_ORDER[0];

  COLOR_ORDER.forEach(function(color) {
    var isActive = color === activeColor;
    var tabBtn = document.createElement('button');
    tabBtn.className = 'color-tab-btn' + (isActive ? ' active' : '');
    tabBtn.dataset.color = color;
    tabBtn.style.setProperty('--tc', COLOR_HEX[color]);
    tabBtn.textContent = COLOR_LABEL[color];
    if (chgByLetter[color]) {
      var dot = document.createElement('span');
      dot.className = 'chg-dot';
      tabBtn.appendChild(dot);
    }
    tabBtn.addEventListener('click', function() { setActiveColor(color); });
    tabBar.appendChild(tabBtn);

    var panel = document.createElement('div');
    panel.className = 'panel' + (isActive ? ' active' : '');
    panel.id = 'panel-' + color;
    panel.innerHTML = '<div class="panel-inner" id="panel-inner-' + color + '"></div>';
    panelsEl.appendChild(panel);

    renderPanel(color, byLetter[color], chgByLetter[color]);
  });

  lastActiveColor = activeColor;
  loadingEl.style.display = 'none';
  tabBar.style.display = 'flex';
  reportNewCards();
}

setActiveColor = (function(original) {
  return function(color) {
    lastActiveColor = color;
    original(color);
  };
})(setActiveColor);

window.addEventListener('message', function(e) {
  var msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'uniair-new-cards') {
    NEW_CARD_IDS = Array.isArray(msg.ids) ? msg.ids : [];
    reportNewCards();
    return;
  }
  if (msg.type !== 'uniair-recalc') return;
  var loadingEl = document.getElementById('loading');
  loadingEl.textContent = 'Recalculating your best teams…';
  loadingEl.style.display = '';
  document.getElementById('color-tab-bar').style.display = 'none';
  
  
  setTimeout(init, 0);
});



setTimeout(init, 0);
</script>
</body>
</html>
